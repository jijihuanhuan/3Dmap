<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>可编辑世界地图</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23e4b56a'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07080d;
      --panel: rgba(16, 18, 28, 0.86);
      --line: rgba(180, 210, 255, 0.14);
      --gold: #e4b56a;
      --gold-2: #f3d7a0;
      --text: #eef3ff;
      --muted: #9aa8c2;
      --danger: #ff8a7a;
      --ok: #8fd9a8;
      --accent: #7ec8ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans SC", sans-serif; }
    body { overflow: hidden; }
    a { color: var(--gold); }
    button, input, select, textarea { font-family: inherit; }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(20,24,40,0.95), rgba(8,10,16,0.88));
      z-index: 5;
    }
    .brand { font-family: "Instrument Serif", serif; font-size: 26px; margin: 0; letter-spacing: -0.03em; }
    .brand span { color: var(--gold); font-style: italic; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .chip, .go {
      border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: 13px;
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .chip.active, .chip:hover { color: #1a1208; background: var(--gold); border-color: var(--gold); }
    .go { background: var(--gold); color: #1a1208; border: 0; font-weight: 700; }
    .go.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
    .go.danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,138,122,0.35); }
    main { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; min-height: 0; }
    aside, .editor {
      background: var(--panel); border-right: 1px solid var(--line);
      padding: 14px; overflow: auto; backdrop-filter: blur(16px);
    }
    .editor { border-right: 0; border-left: 1px solid var(--line); }
    h2 { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
    input[type="text"], input[type="search"], textarea, select {
      width: 100%; background: #0c1018; color: var(--text); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 11px; outline: none;
    }
    textarea { min-height: 88px; resize: vertical; line-height: 1.55; }
    .list { display: grid; gap: 4px; }
    .list button, .marker-item {
      text-align: left; width: 100%; background: #0c1018; color: var(--text);
      border: 1px solid transparent; border-radius: 10px; padding: 8px 10px; cursor: pointer;
    }
    .list button:hover, .list button.active, .marker-item.active { border-color: var(--gold); background: rgba(228,181,106,0.1); }
    .list small, .hint { color: var(--muted); font-size: 12px; }
    .swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 8px; border: 1px solid rgba(255,255,255,0.2); }
    #stage { position: relative; min-width: 0; background:
      radial-gradient(circle at 50% 45%, #14203a 0%, #07080d 62%);
    }
    #globe, #flat { position: absolute; inset: 0; }
    #flat { display: none; overflow: hidden; }
    #flat svg { width: 100%; height: 100%; display: block; }
    #flat path { stroke: rgba(243,215,160,0.28); stroke-width: 0.4; cursor: pointer; }
    #flat path.selected { stroke: var(--gold-2); stroke-width: 1.4; }
    #flat path.polar-line {
      fill: none; stroke: #8ee3ff; stroke-width: 1.25; stroke-dasharray: 6 5;
      cursor: default; pointer-events: none;
    }
    #flat .polar-tag { fill: #b7f0ff; font-size: 11px; font-weight: 600; pointer-events: none; }
    #flat .polar-dot { fill: #fff; stroke: #8ee3ff; stroke-width: 2; pointer-events: none; }
    #flat .ocean-tag { fill: #8ecfff; font-size: 15px; font-weight: 700; letter-spacing: 0.28em; pointer-events: none; }
    #flat .ocean-sub { fill: #8ecfff; font-size: 10px; font-weight: 500; letter-spacing: 0.04em; opacity: 0.75; pointer-events: none; }
    #tooltip {
      position: absolute; pointer-events: none; z-index: 4; display: none;
      background: rgba(8,10,16,0.92); border: 1px solid var(--line); color: var(--text);
      padding: 6px 10px; border-radius: 8px; font-size: 12px; transform: translate(12px, 12px);
    }
    .coords { position: absolute; left: 14px; bottom: 14px; z-index: 3; color: var(--muted); font-size: 12px; }
    .legend {
      position: absolute; right: 14px; bottom: 14px; z-index: 3; color: var(--muted); font-size: 12px;
      background: rgba(8,10,16,0.72); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    }
    .colors { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .colors button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); cursor: pointer; padding: 0; }
    .row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    .pin { display: flex; flex-direction: column; align-items: center; transform: translateY(-8px); cursor: pointer; pointer-events: auto; }
    .country-float {
      pointer-events: none; color: #f3d7a0; font-size: 13px; font-weight: 600;
      text-shadow: 0 1px 8px #000, 0 0 12px rgba(0,0,0,0.8); white-space: nowrap;
      transform: translateY(-16px);
    }
    .polar-float {
      pointer-events: none; display: flex; flex-direction: column; align-items: center;
      color: #b7f0ff; font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
      text-shadow: 0 1px 8px #000, 0 0 14px rgba(0,40,80,0.9); white-space: nowrap;
      transform: translateY(-12px);
    }
    .polar-float small { font-size: 10px; font-weight: 500; letter-spacing: 0; opacity: 0.85; margin-top: 2px; }
    .polar-pole-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #fff; margin-bottom: 5px;
      box-shadow: 0 0 0 4px rgba(142,227,255,0.35), 0 0 16px rgba(142,227,255,0.7);
    }
    .ocean-float {
      pointer-events: none; display: flex; flex-direction: column; align-items: center;
      color: #8ecfff; font-size: 16px; font-weight: 700; letter-spacing: 0.38em;
      text-shadow: 0 1px 10px #000, 0 0 18px rgba(10,50,110,0.95); white-space: nowrap;
    }
    .ocean-float small { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; opacity: 0.72; margin-top: 3px; }
    .pin-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(228,181,106,0.25), 0 8px 18px rgba(0,0,0,0.45); }
    .pin.active .pin-dot { background: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,0.25); }
    .pin-label { margin-top: 4px; font-size: 11px; color: var(--gold-2); text-shadow: 0 1px 4px #000; white-space: nowrap; }
    .loading {
      position: absolute; inset: 0; display: grid; place-items: center; z-index: 6;
      background: rgba(7,8,13,0.72); color: var(--gold-2); font-family: "Instrument Serif", serif; font-size: 28px;
    }
    .err { color: var(--danger); font-size: 13px; }
    .marker-item { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .marker-item b { font-weight: 500; }
    @media (max-width: 1080px) {
      main { grid-template-columns: 1fr; grid-template-rows: 42vh auto auto; }
      aside, .editor { border: 0; border-top: 1px solid var(--line); max-height: 34vh; }
      .brand { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1 class="brand">世界 <span>地图</span></h1>
      <div class="bar">
        <button class="chip active" id="viewGlobe" type="button">球形</button>
        <button class="chip" id="viewFlat" type="button">平面</button>
        <button class="chip" id="toggleSpin" type="button">自转</button>
        <select id="texture" title="地球贴图">
          <option value="political">政治地图</option>
          <option value="marble">卫星</option>
          <option value="night">夜景</option>
        </select>
        <button class="chip" id="modeSelect" type="button">选择</button>
        <button class="chip" id="modePin" type="button">钉标记</button>
        <button class="go ghost" id="exportBtn" type="button">导出</button>
        <button class="go ghost" id="importBtn" type="button">导入</button>
        <input id="importFile" type="file" accept="application/json" hidden />
        <a class="chip" href="./使用说明.txt">使用说明</a>
      </div>
    </header>
    <main>
      <aside>
        <h2>极地</h2>
        <div class="list" id="polarList"></div>
        <h2 style="margin-top:16px">大洋</h2>
        <div class="list" id="oceanList"></div>
        <h2 style="margin-top:16px">国家</h2>
        <input type="search" id="search" placeholder="搜索国家 / 省份" />
        <p class="hint" id="countHint" style="margin:8px 0 10px"></p>
        <div class="list" id="countryList"></div>
        <h2 style="margin-top:18px">中国省份</h2>
        <p class="hint" id="provinceHint" style="margin:8px 0 10px"></p>
        <div class="list" id="provinceList"></div>
        <h2 style="margin-top:18px">标记</h2>
        <div class="list" id="markerList"></div>
      </aside>
      <div id="stage">
        <div id="globe"></div>
        <div id="flat"></div>
        <div id="tooltip"></div>
        <div class="coords" id="coords">拖拽旋转 · 滚轮缩放 · 点击国家或省份可编辑</div>
        <div class="legend">中国省级行政区 · 四大洋 · 极圈 · 编辑保存在本机</div>
        <div class="loading" id="loading">正在展开地球…</div>
      </div>
      <section class="editor">
        <h2>编辑</h2>
        <p class="hint" id="editHint">点击地球上的国家或中国省份，或左侧列表，开始上色和改名。</p>
        <div id="countryEdit" hidden>
          <label>显示名称</label>
          <input type="text" id="editName" />
          <label>填充颜色</label>
          <div class="row2">
            <input type="color" id="editColor" value="#4a6741" style="width:100%;height:38px;padding:0;border:0;background:transparent;cursor:pointer" />
            <button class="go ghost" id="resetCountry" type="button">恢复默认</button>
          </div>
          <div class="colors" id="presets"></div>
          <label>备注</label>
          <textarea id="editNote" placeholder="例如：人口、首都、剧情设定、拍摄地点…"></textarea>
        </div>
        <div id="markerEdit" hidden>
          <label>标记标题</label>
          <input type="text" id="markerTitle" />
          <label>备注</label>
          <textarea id="markerNote" placeholder="这个点代表什么"></textarea>
          <label>颜色</label>
          <input type="color" id="markerColor" value="#e4b56a" style="width:100%;height:38px;padding:0;border:0;background:transparent;cursor:pointer" />
          <div class="bar" style="margin-top:12px">
            <button class="go danger" id="deleteMarker" type="button">删除标记</button>
          </div>
        </div>
        <div class="bar" style="margin-top:16px">
          <button class="go ghost" id="randomColors" type="button">随机配色</button>
          <button class="go danger" id="resetAll" type="button">清空编辑</button>
        </div>
        <p class="err" id="error"></p>
      </section>
    </main>
  </div>

    const $ = (id) => document.getElementById(id);
    const state = {
      countries: [],
      provinces: [],
      edits: { countries: {}, markers: [] },
      selectedId: null,
      selectedMarkerId: null,
      hoverId: null,
      mode: "select",
      view: "globe",
      spinning: true,
      globe: null,
      projection: null,
    };

    function isProvince(f) { return !!(f && f.properties && f.properties.kind === "province"); }
    function isChinaWorld(f) {
      const n = (f.properties && f.properties.name) || "";
      return n === "China" || String(f.id) === "156";
    }
    function isTaiwanWorld(f) {
      const n = (f.properties && f.properties.name) || "";
      return n === "Taiwan" || String(f.id) === "158";
    }
    function englishName(f) {
      if (isProvince(f)) return f.properties.nameEn || f.properties.name;
      return f.properties.name || f.properties.NAME || "Unknown";
    }
    function keyOf(f) { return String(f.id ?? englishName(f)); }
    function hashTone(key) {
      let h = 0;
      for (const c of key) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return TONES[h % TONES.length];
    }
    function displayName(f) {
      const edit = state.edits.countries[keyOf(f)];
      if (edit && edit.name) return edit.name;
      if (isProvince(f)) return f.properties.name;
      return ZH[englishName(f)] || englishName(f);
    }
    function fillColor(f) {
      const edit = state.edits.countries[keyOf(f)];
      if (edit && edit.color) return edit.color;
      return hashTone(keyOf(f));
    }
    function mapFeatures() {
      return state.countries.filter((f) => !isChinaWorld(f) && !isTaiwanWorld(f)).concat(state.provinces);
    }
    function findCountry(id) {
      return mapFeatures().concat(state.countries).find((f) => keyOf(f) === id);
    }
    function centroid(f) {
      const c = d3.geoCentroid(f);
      return { lng: c[0], lat: c[1] };
    }
    function loadEdits() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.edits.countries = parsed.countries || {};
          state.edits.markers = parsed.markers || [];
        }
      } catch {}
    }
    function saveEdits() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state.edits));
    }
    function ensureCountryEdit(id) {
      if (!state.edits.countries[id]) state.edits.countries[id] = {};
      return state.edits.countries[id];
    }

    async function loadWorld() {
      let lastErr;
      for (const url of TOPO_URLS) {
        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(resp.statusText);
          const topo = await resp.json();
          return topojson.feature(topo, topo.objects.countries).features;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error("无法加载世界地图数据");
    }

    async function loadChinaProvinces() {
      let lastErr;
      for (const url of CHINA_GEO_URLS) {
        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(resp.statusText);
          const geo = await resp.json();
          return (geo.features || []).map((f) => {
            const name = (f.properties && f.properties.name) || "未命名";
            return {
              type: "Feature",
              id: "cn-" + String((f.properties && f.properties.id) || f.id || name),
              properties: {
                name,
                nameEn: CN_EN[name] || name,
                kind: "province",
              },
              geometry: f.geometry,
            };
          });
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error("无法加载中国省份数据");
    }

    function parallelPoints(lat, steps = 180) {
      const pts = [];
      for (let i = 0; i <= steps; i++) pts.push([lat, -180 + (360 * i) / steps]);
      return pts;
    }
    function parallelGeo(lat, step = 2) {
      const coordinates = [];
      for (let lng = -180; lng <= 180; lng += step) coordinates.push([lng, lat]);
      return { type: "LineString", coordinates };
    }
    const POLAR_PATHS = [
      { name: "北极圈", coords: parallelPoints(POLAR_CIRCLE_LAT), color: "#8ee3ff" },
      { name: "南极圈", coords: parallelPoints(-POLAR_CIRCLE_LAT), color: "#8ee3ff" },
    ];

    function overlayItems() {
      const items = POLAR_MARKS.concat(OCEAN_MARKS).map((m) => Object.assign({}, m));
      state.edits.markers.forEach((m) => items.push(Object.assign({ kind: "pin" }, m)));
      const f = findCountry(state.selectedId);
      if (f) {
        const c = centroid(f);
        items.push({ id: "__sel__", kind: "label", lat: c.lat, lng: c.lng, title: displayName(f), color: "#f3d7a0" });
      }
      return items;
    }

    function markerElement(d) {
      const el = document.createElement("div");
      if (d.kind === "label") {
        el.className = "country-float";
        el.textContent = d.title || "";
        return el;
      }
      if (d.kind === "ocean") {
        el.className = "ocean-float";
        el.innerHTML = `${escapeHtml(d.title)}<small>${escapeHtml(d.sub || "")}</small>`;
        return el;
      }
      if (d.kind === "polar" || d.kind === "polar-pole") {
        el.className = "polar-float";
        el.innerHTML = (d.kind === "polar-pole" ? `<span class="polar-pole-dot"></span>` : "") +
          `${escapeHtml(d.title)}<small>${escapeHtml(d.sub || "")}</small>`;
        return el;
      }
      el.className = "pin" + (d.id === state.selectedMarkerId ? " active" : "");
      el.innerHTML = `<span class="pin-dot" style="background:${d.color || "#e4b56a"}"></span><span class="pin-label">${escapeHtml(d.title || "标记")}</span>`;
      el.style.pointerEvents = "auto";
      el.addEventListener("click", (ev) => {
        ev.stopPropagation();
        selectMarker(d.id);
      });
      return el;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function createGlobe(el) {
      if (typeof Globe !== "function") throw new Error("球体引擎加载失败，请检查网络");
      try {
        return new Globe(el);
      } catch {
        return Globe()(el);
      }
    }

    function setupGlobe() {
      const el = $("globe");
      const globe = createGlobe(el)
        .backgroundImageUrl(IMG.stars)
        .globeImageUrl(IMG.political)
        .bumpImageUrl("https://cdn.jsdelivr.net/npm/three-globe@2.44.1/example/img/earth-topology.png")
        .atmosphereColor("#9ecbff")
        .atmosphereAltitude(0.18)
        .polygonsData(mapFeatures())
        .polygonCapColor((d) => {
          const c = fillColor(d);
          return keyOf(d) === state.selectedId ? c : hexToRgba(c, 0.82);
        })
        .polygonSideColor(() => "rgba(0,0,0,0.28)")
        .polygonStrokeColor((d) => {
          if (keyOf(d) === state.selectedId) return "#f3d7a0";
          return isProvince(d) ? "rgba(243,215,160,0.5)" : "rgba(243,215,160,0.22)";
        })
        .polygonAltitude((d) => keyOf(d) === state.selectedId ? 0.07 : keyOf(d) === state.hoverId ? 0.035 : 0.01)
        .polygonLabel((d) => `<div style="font-family:Noto Sans SC,sans-serif">${escapeHtml(displayName(d))}${isProvince(d) ? " · 中国" : ""}</div>`)
        .onPolygonHover((d) => {
          state.hoverId = d ? keyOf(d) : null;
          globe.polygonAltitude(globe.polygonAltitude());
          $("coords").textContent = d
            ? `${displayName(d)} · ${englishName(d)}${isProvince(d) ? " · 中国省份" : ""}`
            : "拖拽旋转 · 滚轮缩放 · 点击国家或省份可编辑";
        })
        .onPolygonClick((d) => {
          if (state.mode === "pin") return;
          selectCountry(keyOf(d), true);
        })
        .onGlobeClick(({ lat, lng }) => {
          $("coords").textContent = `${lat.toFixed(2)}°, ${lng.toFixed(2)}°`;
          if (state.mode === "pin") addMarker(lat, lng);
        })
        .pathsData(POLAR_PATHS)
        .pathPoints("coords")
        .pathPointLat((p) => p[0])
        .pathPointLng((p) => p[1])
        .pathColor((d) => d.color)
        .pathStroke(0.85)
        .pathPointAlt(0.012)
        .pathDashLength(0.06)
        .pathDashGap(0.035)
        .pathDashAnimateTime(12000)
        .pathLabel((d) => `<div style="font-family:Noto Sans SC,sans-serif">${d.name}</div>`)
        .htmlElementsData(overlayItems())
        .htmlLat("lat")
        .htmlLng("lng")
        .htmlAltitude((d) => d.kind === "polar-pole" ? 0.045 : d.kind === "ocean" ? 0.012 : 0.02)
        .htmlElement(markerElement);

      globe.controls().autoRotate = true;
      globe.controls().autoRotateSpeed = 0.45;
      globe.controls().enableDamping = true;
      globe.pointOfView({ lat: 25, lng: 105, altitude: 2.15 }, 0);
      state.globe = globe;
      resizeGlobe();
    }

    function hexToRgba(hex, a) {
      const h = hex.replace("#", "");
      const n = parseInt(h.length === 3 ? h.split("").map((x) => x + x).join("") : h, 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    }

    function refreshGlobe() {
      const g = state.globe;
      if (!g) return;
      g.polygonsData(mapFeatures());
      g.polygonCapColor(g.polygonCapColor());
      g.polygonStrokeColor(g.polygonStrokeColor());
      g.polygonAltitude(g.polygonAltitude());
      g.htmlElementsData(overlayItems());
    }

    function setupFlat() {
      const host = $("flat");
      host.innerHTML = "";
      const w = host.clientWidth || 800;
      const h = host.clientHeight || 600;
      const svg = d3.select(host).append("svg").attr("viewBox", `0 0 ${w} ${h}`);
      const projection = d3.geoNaturalEarth1().fitExtent([[16, 16], [w - 16, h - 16]], { type: "Sphere" });
      state.projection = projection;
      const path = d3.geoPath(projection);
      svg.append("path").datum({ type: "Sphere" }).attr("d", path).attr("fill", "#0b1528").attr("stroke", "rgba(243,215,160,0.2)");
      svg.append("g").attr("class", "land").selectAll("path")
        .data(mapFeatures())
        .join("path")
        .attr("d", path)
        .attr("data-id", (d) => keyOf(d))
        .attr("stroke-width", (d) => isProvince(d) ? 0.7 : 0.4)
        .on("mouseenter", (event, d) => {
          $("tooltip").style.display = "block";
          $("tooltip").textContent = displayName(d);
          $("coords").textContent = `${displayName(d)} · ${englishName(d)}${isProvince(d) ? " · 中国省份" : ""}`;
        })
        .on("mousemove", (event) => {
          $("tooltip").style.left = event.offsetX + "px";
          $("tooltip").style.top = event.offsetY + "px";
        })
        .on("mouseleave", () => { $("tooltip").style.display = "none"; })
        .on("click", (event, d) => {
          event.stopPropagation();
          if (state.mode === "pin") {
            const [lng, lat] = projection.invert(d3.pointer(event, svg.node()));
            addMarker(lat, lng);
            return;
          }
          selectCountry(keyOf(d), true);
        });
      svg.on("click", (event) => {
        if (state.mode !== "pin") return;
        const inv = projection.invert(d3.pointer(event, svg.node()));
        if (inv) addMarker(inv[1], inv[0]);
      });
      svg.append("g").attr("class", "polar").selectAll("path")
        .data([
          { name: "北极圈", geo: parallelGeo(POLAR_CIRCLE_LAT) },
          { name: "南极圈", geo: parallelGeo(-POLAR_CIRCLE_LAT) },
        ])
        .join("path")
        .attr("class", "polar-line")
        .attr("d", (d) => path(d.geo));
      svg.append("g").attr("class", "polar-labels").selectAll("g")
        .data(POLAR_MARKS)
        .join("g")
        .attr("transform", (d) => {
          const p = projection([d.lng, d.lat]);
          return p ? `translate(${p[0]},${p[1]})` : "translate(-99,-99)";
        })
        .each(function (d) {
          const g = d3.select(this);
          if (d.kind === "polar-pole") g.append("circle").attr("class", "polar-dot").attr("r", 4);
          g.append("text").attr("class", "polar-tag").attr("text-anchor", "middle")
            .attr("y", d.kind === "polar-pole" ? -10 : -6).text(d.title);
          g.append("text").attr("class", "polar-tag").attr("text-anchor", "middle")
            .attr("y", d.kind === "polar-pole" ? 16 : 10).attr("opacity", 0.75).style("font-size", "10px").text(d.sub);
        });
      svg.append("g").attr("class", "ocean-labels").selectAll("g")
        .data(OCEAN_MARKS)
        .join("g")
        .attr("transform", (d) => {
          const p = projection([d.lng, d.lat]);
          return p ? `translate(${p[0]},${p[1]})` : "translate(-99,-99)";
        })
        .each(function (d) {
          const g = d3.select(this);
          g.append("text").attr("class", "ocean-tag").attr("text-anchor", "middle").attr("y", -4).text(d.title);
          g.append("text").attr("class", "ocean-sub").attr("text-anchor", "middle").attr("y", 14).text(d.sub);
        });
      svg.append("g").attr("class", "pins");
      refreshFlat();
    }

    function refreshFlat() {
      const host = $("flat");
      const svg = d3.select(host).select("svg");
      if (svg.empty()) return;
      svg.select(".land").selectAll("path")
        .attr("fill", (d) => fillColor(d))
        .attr("class", (d) => keyOf(d) === state.selectedId ? "selected" : null);
      const projection = state.projection;
      svg.select(".pins").selectAll("g.pin2").data(state.edits.markers, (d) => d.id)
        .join((enter) => {
          const g = enter.append("g").attr("class", "pin2").style("cursor", "pointer");
          g.append("circle").attr("r", 5).attr("stroke", "#fff").attr("stroke-width", 1);
          g.append("text").attr("y", -10).attr("text-anchor", "middle").attr("fill", "#f3d7a0").attr("font-size", 11);
          g.on("click", (event, d) => { event.stopPropagation(); selectMarker(d.id); });
          return g;
        })
        .attr("transform", (d) => {
          const p = projection([d.lng, d.lat]);
          return p ? `translate(${p[0]},${p[1]})` : "translate(-99,-99)";
        })
        .each(function (d) {
          d3.select(this).select("circle").attr("fill", d.color || "#e4b56a");
          d3.select(this).select("text").text(d.title || "标记");
        });
    }

    function refreshAll() {
      refreshGlobe();
      refreshFlat();
      renderLists();
      renderEditor();
    }

    function renderLists() {
      $("polarList").innerHTML = POLAR_MARKS.map((m) => `
        <button type="button" data-polar="${m.id}">
          ${escapeHtml(m.title)}
          <br><small>${escapeHtml(m.sub)}</small>
        </button>
      `).join("");
      $("polarList").querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const mark = POLAR_MARKS.find((m) => m.id === btn.dataset.polar);
          if (!mark) return;
          $("coords").textContent = `${mark.title} · ${mark.sub}`;
          if (state.view === "globe") flyTo(mark.view.lat, mark.view.lng, mark.view.altitude);
        });
      });
      $("oceanList").innerHTML = OCEAN_MARKS.filter((m) => !m.silent).map((m) => `
        <button type="button" data-ocean="${m.id}">
          ${escapeHtml(m.title)}
          <br><small>${escapeHtml(m.sub)}</small>
        </button>
      `).join("");
      $("oceanList").querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const mark = OCEAN_MARKS.find((m) => m.id === btn.dataset.ocean);
          if (!mark) return;
          $("coords").textContent = `${mark.title} · ${mark.sub}`;
          if (state.view === "globe") flyTo(mark.view.lat, mark.view.lng, mark.view.altitude);
        });
      });
      const q = $("search").value.trim().toLowerCase();
      const countryRows = state.countries
        .filter((f) => !isTaiwanWorld(f))
        .map((f) => ({ f, id: keyOf(f), name: displayName(f), en: englishName(f) }))
        .filter((x) => !q || x.name.toLowerCase().includes(q) || x.en.toLowerCase().includes(q))
        .sort((a, b) => a.name.localeCompare(b.name, "zh"));
      $("countHint").textContent = `${state.countries.filter((f) => !isTaiwanWorld(f)).length} 个国家 / 地区` + (q ? ` · 筛选 ${countryRows.length}` : "");
      $("countryList").innerHTML = countryRows.map((x) => `
        <button type="button" data-id="${x.id}" class="${x.id === state.selectedId ? "active" : ""}">
          <span class="swatch" style="background:${isChinaWorld(x.f) ? "#c23b22" : fillColor(x.f)}"></span>${escapeHtml(x.name)}
          <br><small>${escapeHtml(isChinaWorld(x.f) ? "含省级行政区" : x.en)}</small>
        </button>
      `).join("");
      $("countryList").querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => selectCountry(btn.dataset.id, true));
      });
      const provinceRows = state.provinces
        .map((f) => ({ f, id: keyOf(f), name: displayName(f), en: englishName(f) }))
        .filter((x) => !q || x.name.toLowerCase().includes(q) || x.en.toLowerCase().includes(q))
        .sort((a, b) => a.name.localeCompare(b.name, "zh"));
      $("provinceHint").textContent = `${state.provinces.length} 个省级行政区` + (q ? ` · 筛选 ${provinceRows.length}` : "");
      $("provinceList").innerHTML = provinceRows.map((x) => `
        <button type="button" data-id="${x.id}" class="${x.id === state.selectedId ? "active" : ""}">
          <span class="swatch" style="background:${fillColor(x.f)}"></span>${escapeHtml(x.name)}
          <br><small>${escapeHtml(x.en)}</small>
        </button>
      `).join("");
      $("provinceList").querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => selectCountry(btn.dataset.id, true));
      });
      $("markerList").innerHTML = state.edits.markers.length
        ? state.edits.markers.map((m) => `
            <div class="marker-item ${m.id === state.selectedMarkerId ? "active" : ""}" data-id="${m.id}">
              <b>${escapeHtml(m.title || "未命名标记")}</b>
              <small>${m.lat.toFixed(1)}, ${m.lng.toFixed(1)}</small>
            </div>
          `).join("")
        : `<p class="hint">切换到「钉标记」，再点地图放置。</p>`;
      $("markerList").querySelectorAll(".marker-item").forEach((el) => {
        el.addEventListener("click", () => selectMarker(el.dataset.id));
      });
    }

    function renderEditor() {
      const country = findCountry(state.selectedId);
      const marker = state.edits.markers.find((m) => m.id === state.selectedMarkerId);
      $("countryEdit").hidden = !country;
      $("markerEdit").hidden = !marker;
      if (country) {
        const edit = state.edits.countries[state.selectedId] || {};
        $("editHint").textContent = `正在编辑：${displayName(country)}`;
        $("editName").value = edit.name || displayName(country);
        $("editColor").value = edit.color || fillColor(country);
        $("editNote").value = edit.note || "";
      } else if (marker) {
        $("editHint").textContent = `正在编辑标记：${marker.title || "未命名"}`;
        $("markerTitle").value = marker.title || "";
        $("markerNote").value = marker.note || "";
        $("markerColor").value = marker.color || "#e4b56a";
      } else {
        $("editHint").textContent = state.mode === "pin"
          ? "点击地球或平面地图上的任意位置，放下一个标记。"
          : "点击地球上的国家或中国省份，或左侧列表，开始上色和改名。";
      }
    }

    function flyTo(lat, lng, altitude = 1.65) {
      if (state.globe) state.globe.pointOfView({ lat, lng, altitude }, 900);
    }

    function selectCountry(id, fly) {
      const f = findCountry(id);
      if (f && isChinaWorld(f)) {
        state.selectedId = null;
        state.selectedMarkerId = null;
        $("coords").textContent = "中国 · 已展开省级行政区";
        if (fly && state.view === "globe") flyTo(35.8, 104.2, 1.28);
        refreshAll();
        return;
      }
      state.selectedId = id;
      state.selectedMarkerId = null;
      if (f && fly && state.view === "globe") {
        const c = centroid(f);
        flyTo(c.lat, c.lng, isProvince(f) ? 1.12 : 1.65);
      }
      refreshAll();
    }

    function selectMarker(id) {
      state.selectedMarkerId = id;
      state.selectedId = null;
      const m = state.edits.markers.find((x) => x.id === id);
      if (m && state.view === "globe") flyTo(m.lat, m.lng, 1.4);
      refreshAll();
    }

    function addMarker(lat, lng) {
      const marker = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        lat, lng,
        title: "新标记",
        note: "",
        color: "#e4b56a",
      };
      state.edits.markers.push(marker);
      saveEdits();
      selectMarker(marker.id);
    }

    function setView(view) {
      state.view = view;
      $("viewGlobe").classList.toggle("active", view === "globe");
      $("viewFlat").classList.toggle("active", view === "flat");
      $("globe").style.display = view === "globe" ? "block" : "none";
      $("flat").style.display = view === "flat" ? "block" : "none";
      if (view === "flat") setupFlat();
      else resizeGlobe();
    }

    function setMode(mode) {
      state.mode = mode;
      $("modeSelect").classList.toggle("active", mode === "select");
      $("modePin").classList.toggle("active", mode === "pin");
      $("coords").textContent = mode === "pin" ? "点击地图放置标记" : "拖拽旋转 · 滚轮缩放 · 点击国家或省份可编辑";
      renderEditor();
    }

    function resizeGlobe() {
      if (!state.globe) return;
      const el = $("globe");
      state.globe.width(el.clientWidth).height(el.clientHeight);
    }

    PRESETS.forEach((color) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.style.background = color;
      btn.title = color;
      btn.addEventListener("click", () => {
        if (!state.selectedId) return;
        ensureCountryEdit(state.selectedId).color = color;
        saveEdits();
        refreshAll();
      });
      $("presets").appendChild(btn);
    });

    $("search").addEventListener("input", renderLists);
    $("editName").addEventListener("input", () => {
      if (!state.selectedId) return;
      ensureCountryEdit(state.selectedId).name = $("editName").value;
      saveEdits();
      refreshAll();
    });
    $("editColor").addEventListener("input", () => {
      if (!state.selectedId) return;
      ensureCountryEdit(state.selectedId).color = $("editColor").value;
      saveEdits();
      refreshAll();
    });
    $("editNote").addEventListener("input", () => {
      if (!state.selectedId) return;
      ensureCountryEdit(state.selectedId).note = $("editNote").value;
      saveEdits();
    });
    $("resetCountry").addEventListener("click", () => {
      if (!state.selectedId) return;
      delete state.edits.countries[state.selectedId];
      saveEdits();
      refreshAll();
    });
    $("markerTitle").addEventListener("input", () => {
      const m = state.edits.markers.find((x) => x.id === state.selectedMarkerId);
      if (!m) return;
      m.title = $("markerTitle").value;
      saveEdits();
      refreshAll();
    });
    $("markerNote").addEventListener("input", () => {
      const m = state.edits.markers.find((x) => x.id === state.selectedMarkerId);
      if (!m) return;
      m.note = $("markerNote").value;
      saveEdits();
    });
    $("markerColor").addEventListener("input", () => {
      const m = state.edits.markers.find((x) => x.id === state.selectedMarkerId);
      if (!m) return;
      m.color = $("markerColor").value;
      saveEdits();
      refreshAll();
    });
    $("deleteMarker").addEventListener("click", () => {
      state.edits.markers = state.edits.markers.filter((m) => m.id !== state.selectedMarkerId);
      state.selectedMarkerId = null;
      saveEdits();
      refreshAll();
    });
    $("viewGlobe").addEventListener("click", () => setView("globe"));
    $("viewFlat").addEventListener("click", () => setView("flat"));
    $("modeSelect").addEventListener("click", () => setMode("select"));
    $("modePin").addEventListener("click", () => setMode("pin"));
    $("toggleSpin").addEventListener("click", () => {
      state.spinning = !state.spinning;
      $("toggleSpin").classList.toggle("active", state.spinning);
      if (state.globe) state.globe.controls().autoRotate = state.spinning;
    });
    $("texture").addEventListener("change", () => {
      if (state.globe) state.globe.globeImageUrl(IMG[$("texture").value]);
    });
    $("randomColors").addEventListener("click", () => {
      mapFeatures().forEach((f) => {
        ensureCountryEdit(keyOf(f)).color = PRESETS[Math.floor(Math.random() * PRESETS.length)];
      });
      saveEdits();
      refreshAll();
    });
    $("resetAll").addEventListener("click", () => {
      if (!confirm("清空本机保存的全部颜色、名称、备注和标记？")) return;
      state.edits = { countries: {}, markers: [] };
      state.selectedId = null;
      state.selectedMarkerId = null;
      saveEdits();
      refreshAll();
    });
    $("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state.edits, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "world-map.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });
    $("importBtn").addEventListener("click", () => $("importFile").click());
    $("importFile").addEventListener("change", async () => {
      const file = $("importFile").files[0];
      $("importFile").value = "";
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        state.edits.countries = parsed.countries || {};
        state.edits.markers = parsed.markers || [];
        saveEdits();
        refreshAll();
      } catch (err) {
        $("error").textContent = "导入失败：" + (err.message || err);
      }
    });
    window.addEventListener("resize", () => {
      resizeGlobe();
      if (state.view === "flat") setupFlat();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") {
        state.selectedId = null;
        state.selectedMarkerId = null;
        refreshAll();
      }
      if ((ev.key === "Delete" || ev.key === "Backspace") && state.selectedMarkerId && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
        $("deleteMarker").click();
      }
    });

    (async function init() {
      try {
        loadEdits();
        state.countries = await loadWorld();
        try {
          state.provinces = await loadChinaProvinces();
        } catch (err) {
          state.provinces = [];
          $("error").textContent = "中国省份数据加载失败：" + (err.message || err);
        }
        setupGlobe();
        setupFlat();
        setMode("select");
        $("toggleSpin").classList.add("active");
        $("modeSelect").classList.add("active");
        refreshAll();
        $("loading").remove();
      } catch (err) {
        $("loading").textContent = "地图数据加载失败，请检查网络后刷新。";
        $("error").textContent = String(err.message || err);
      }
    })();
  </script>
</body>
</html>
